[package]
edition = "2021"
name = "trace"
version = "0.1.0"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "form", "native-tls"] }
security-framework = "3.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
toml = "1.1.2"
url = "2.5.8"
webbrowser = "1.2.1"
