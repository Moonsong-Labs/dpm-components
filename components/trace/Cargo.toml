[package]
edition = "2021"
name = "trace"
version = "0.1.0"

[dependencies]
base64 = "0.22.1"
owo-colors = "4.2.0"
clap = { version = "4.6.1", features = ["derive"] }
prost = "0.14.4"
prost-types = "0.14.4"
rand = "0.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "form", "native-tls"] }
security-framework = "3.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
toml = "1.1.2"
tonic = "0.14.6"
tonic-prost = "0.14.6"
url = "2.5.8"
webbrowser = "1.2.1"
